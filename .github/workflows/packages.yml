# Portions adapted from MeetHub (MIT): .github/workflows/packages.yml
name: Packages

# The files of a release, built for linux/amd64 by make package (packaging/build.sh) into dist/packages:
#   streamgo_<version>_amd64.deb, streamgo-<version>-1.x86_64.rpm, streamgo_<version>_linux_amd64.tar.gz,
#   streamgo_<version>_linux_amd64 (the single file), streamgo-server_<version>_linux_amd64.tar.gz (StreamGo alone)
#   and SHA256SUMS, written after the last of them.
# They are built and tested on every pull request, push to main and v* tag:
#   - packaging/smoke.sh installs the packages in clean Debian, Ubuntu, AlmaLinux and Rocky Linux (RPM Fusion)
#     containers
#   - packaging/single-smoke.sh runs the single file in a clean Debian container (a working studio, the key kept,
#     the parent killed, a damaged file, the upgrade from the previous release's single file when it has one)
#   - the .deb is installed on the runner itself, where systemd really starts the three services
# A v* tag (vX.Y.Z only: the first step refuses any other) then publishes the six files as the assets of that tag's
# GitHub release (packaging/publish-release.sh), with that version's section of CHANGELOG.md as the notes. Only the
# publish job, which runs on a tag alone, may write to the repository; the build and its tests are read-only. Lint and
# the test suites run in ci.yml; tag a commit of main that passed it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: deb, rpm, tar.gz and the single file
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          printf '%s\n' "$VERSION" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' ||
            { echo "the tag is not vX.Y.Z: nothing is built or published" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and install in clean containers
        run: make test-package VERSION="$VERSION" COMMIT="$GITHUB_SHA"
      - name: Smoke test the single file
        env:
          GH_TOKEN: ${{ github.token }}
        # the upgrade check runs from the single file of the latest release before this one, when it published one; a
        # failure to list or download fails the step (only a release without the file skips the check)
        run: |
          set -eu
          ls dist/packages
          (cd dist/packages && sha256sum --check --strict SHA256SUMS)
          tags=$(gh release list --exclude-drafts --limit 30 --json tagName --jq '.[].tagName')
          previous=$(printf '%s\n' "$tags" | grep -vxF "${GITHUB_REF_NAME}" | head -n 1 || true)
          if [ -n "$previous" ]; then
            assets=$(gh release view "$previous" --json assets --jq '.assets[].name')
            single=$(printf '%s\n' "$assets" | grep -x 'streamgo_[0-9.]*_linux_amd64' || true)
            if [ -n "$single" ]; then
              gh release download "$previous" --pattern "$single" --dir "$RUNNER_TEMP/previous"
              export SMOKE_PREVIOUS_SINGLE="$RUNNER_TEMP/previous/$single"
            else
              echo "the release $previous has no single file: the upgrade check is skipped"
            fi
          fi
          make tools
          packaging/single-smoke.sh dist/packages/streamgo_*_linux_amd64 "$VERSION" dist/packages
      - name: Install on the runner, under systemd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/packages/streamgo_*_amd64.deb
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          systemctl is-active streamgo-livekit.service streamgo-mediamtx.service streamgo.service
          curl -fsS http://127.0.0.1:8080/readyz
          sudo systemctl restart streamgo-livekit.service streamgo-mediamtx.service streamgo.service
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          sudo systemctl stop streamgo.service
          test "$(systemctl show -p Result --value streamgo.service)" = success
      - name: Service log
        if: failure()
        run: sudo journalctl -u streamgo -u streamgo-livekit -u streamgo-mediamtx --no-pager | tail -n 120
      - name: Keep the files for the publish job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/packages/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: packages
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the release of the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/packages
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # the six files the packages job built and tested; the script checks the tag again
        run: packaging/publish-release.sh "$TAG" dist/packages CHANGELOG.md
