# make dev: the Vite dev server (hot reload) on DEV_PORT (5173) in front of the stack, proxying /api to the streamgo
# container. The browser's origin is then the dev server, so the server's public URL follows it (the Origin check).
# It runs as the calling user (DEV_UID/DEV_GID, set by make), so frontend/node_modules stays the user's.
# Portions adapted from MeetHub (MIT): deployments/compose/compose.dev.yml
services:
  streamgo:
    environment:
      STREAMGO_SERVER_PUBLIC_URL: http://localhost:${DEV_PORT:-5173}

  frontend:
    image: node:24.16-bookworm-slim@sha256:2c87ef9bd3c6a3bd4b472b4bec2ce9d16354b0c574f736c476489d09f560a203
    user: ${DEV_UID:-1000}:${DEV_GID:-1000}
    working_dir: /src/frontend
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    environment:
      STREAMGO_API_URL: http://streamgo:8080
      HOME: /tmp
      npm_config_update_notifier: "false"
    volumes:
      - ../..:/src
    ports:
      - "${DEV_PORT:-5173}:5173"
    depends_on:
      - streamgo
