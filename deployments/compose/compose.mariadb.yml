# make up DB=mariadb: MariaDB instead of SQLite. The password comes from STREAMGO_DATABASE_PASSWORD in .env.
# Portions adapted from MeetHub (MIT): deployments/compose/compose.mariadb.yml
services:
  streamgo:
    environment:
      STREAMGO_DATABASE_DRIVER: mariadb
      STREAMGO_DATABASE_DSN: streamgo:${STREAMGO_DATABASE_PASSWORD:?run make init}@tcp(mariadb:3306)/streamgo
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: streamgo
      MARIADB_USER: streamgo
      MARIADB_PASSWORD: ${STREAMGO_DATABASE_PASSWORD:?run make init}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

volumes:
  mariadb-data:
