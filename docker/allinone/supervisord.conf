; StreamGo all-in-one: LiveKit, MediaMTX and the streamgo server in one container, logs on stdout (docker logs).
; Nothing runs as root: the container starts as the streamgo user (uid 65532), which owns /data.
; Portions adapted from MeetHub (MIT): docker/allinone/supervisord.conf
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; docker exec <container> supervisorctl status | restart streamgo
; The socket is private to the container's only user (0700), so it has no password: supervisord logs one CRIT line
; about that at every start.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; the studio rooms: signalling on 127.0.0.1:7880 (the server proxies it at /livekit/), media on 7881/tcp and
; 7882/udp, advertised at NODE_IP; the key and secret come from the entrypoint (LIVEKIT_KEYS)
[program:livekit]
command=/usr/local/bin/livekit-server --config /etc/streamgo/livekit.yaml --node-ip %(ENV_NODE_IP)s
priority=10
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; the program ingest: WHIP, RTSP and the API on 127.0.0.1, WebRTC media on 8189 (UDP and TCP) advertised at NODE_IP
[program:mediamtx]
command=/usr/local/bin/mediamtx /etc/streamgo/mediamtx.yml
priority=10
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; stopped first. The three stopwaitsecs add up to 45s: run the container with --stop-timeout 50.
[program:streamgo]
command=/usr/local/bin/streamgo server
directory=/data
priority=20
startsecs=3
startretries=10
autorestart=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
