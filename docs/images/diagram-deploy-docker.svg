<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1840" viewBox="0 0 1200 1840" version="1.1">
  <title>Docker Compose stack</title>
  <desc>Browsers reach the published HTTP, LiveKit and MediaMTX ports on a Docker host. Its Compose network contains StreamGo with ffmpeg, LiveKit without Redis, MediaMTX, and an optional MariaDB or PostgreSQL container. StreamGo calls LiveKit over its HTTP API, MediaMTX over WHIP, RTSP and its API, and the optional database over SQL. StreamGo and the database have separate data volumes. ffmpeg relays RTMP or RTMPS to external destinations. The host uses an environment file and a read-only configuration file. NODE_IP controls the address advertised to browsers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3b8ff"/>
    </marker>
  </defs>
  <rect id="canvas" width="1200" height="1840" rx="8" fill="#0c1020"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="32" y="58" font-size="26" fill="#f2f4fb">Docker Compose stack</text>

    <g id="docker-host">
      <rect x="236" y="112" width="748" height="1468" rx="8" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>
      <text x="260" y="158" font-size="22" fill="#f2f4fb">Docker host</text>
    </g>
    <g id="compose-network">
      <rect x="520" y="190" width="440" height="1354" rx="8" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>
      <text x="544" y="228" font-size="22" fill="#f2f4fb">Compose network</text>
    </g>

    <g fill="none" stroke="#b3b8ff" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 168 332 H 220"/>
      <path d="M 168 663 H 220"/>
      <path d="M 168 773 H 220"/>
      <path d="M 168 883 H 220"/>
      <path d="M 168 1123 H 220"/>

      <path d="M 508 332 H 548"/>
      <path d="M 508 663 H 548"/>
      <path d="M 508 773 H 548"/>
      <path d="M 508 883 H 548"/>
      <path d="M 508 1123 H 548"/>

      <path d="M 592 456 V 646"/>
      <path d="M 892 440 H 916 V 1123 H 892"/>
      <path d="M 892 400 H 956 V 1445 H 892"/>
      <path d="M 892 350 H 1008"/>
    </g>
    <g fill="none" stroke="#b3b8ff" stroke-width="2">
      <path d="M 764 456 V 480"/>
      <path d="M 548 1445 H 496"/>
    </g>

    <g id="browsers">
      <rect x="24" y="300" width="144" height="866" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="96" y="740" text-anchor="middle" font-size="20" fill="#f2f4fb">Browsers</text>
    </g>
    <g id="rtmp-destinations">
      <rect x="1008" y="326" width="168" height="104" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="1092" y="366" text-anchor="middle" font-size="22" fill="#f2f4fb">RTMP</text>
      <text x="1092" y="400" text-anchor="middle" font-size="20" fill="#f2f4fb">destinations</text>
    </g>

    <g id="streamgo">
      <rect x="548" y="300" width="344" height="156" rx="8" fill="#3d41cf" stroke="#2c3458" stroke-width="1.5"/>
      <text x="568" y="338" font-size="22" fill="#f2f4fb">streamgo</text>
      <text x="568" y="378" font-size="18" fill="#f2f4fb">
        <tspan x="568" y="378">StreamGo + ffmpeg,</tspan>
        <tspan x="568" y="406">user 65532</tspan>
      </text>
    </g>
    <g id="livekit">
      <rect x="548" y="646" width="344" height="254" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="568" y="740" font-size="22" fill="#f2f4fb">livekit</text>
      <text x="568" y="780" font-size="18" fill="#b9c0d8">
        <tspan x="568" y="780">livekit-server v1.13.10,</tspan>
        <tspan x="568" y="808">no Redis</tspan>
      </text>
    </g>
    <g id="mediamtx">
      <rect x="548" y="1030" width="344" height="186" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="568" y="1070" font-size="22" fill="#f2f4fb">mediamtx</text>
      <text x="568" y="1108" font-size="18" fill="#b9c0d8">
        <tspan x="568" y="1108">mediamtx 1.21.4;</tspan>
        <tspan x="568" y="1136">WHIP 8889, RTSP 8554,</tspan>
        <tspan x="568" y="1164">API 9997 stay inside</tspan>
      </text>
    </g>
    <g id="database">
      <rect x="548" y="1370" width="344" height="150" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5" stroke-dasharray="8 6"/>
      <text x="568" y="1410" font-size="22" fill="#f2f4fb">mariadb or postgres</text>
      <text x="568" y="1448" font-size="18" fill="#b9c0d8">
        <tspan x="568" y="1448">(optional: DB=mariadb</tspan>
        <tspan x="568" y="1476">or DB=postgres)</tspan>
      </text>
    </g>

    <g id="streamgo-data">
      <path d="M 652 496 V 480 H 786 V 496 H 876 V 612 H 652 Z" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="668" y="532" font-size="20" fill="#f2f4fb">streamgo-data</text>
      <text x="668" y="564" font-size="18" fill="#b9c0d8">
        <tspan x="668" y="564">(/data: SQLite,</tspan>
        <tspan x="668" y="590">logos, lock)</tspan>
      </text>
    </g>
    <g id="database-data">
      <path d="M 272 1386 V 1370 H 406 V 1386 H 496 V 1502 H 272 Z" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="288" y="1422" font-size="20" fill="#f2f4fb">
        <tspan x="288" y="1422">mariadb-data /</tspan>
        <tspan x="288" y="1452">postgres-data</tspan>
      </text>
    </g>

    <g id="http-port">
      <rect x="220" y="300" width="288" height="64" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="236" y="338" font-size="18" fill="#f2f4fb">HTTP_PORT 8080/tcp</text>
    </g>
    <g id="livekit-port">
      <rect x="220" y="620" width="288" height="86" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="236" y="654" font-size="18" fill="#f2f4fb">
        <tspan x="236" y="654">LIVEKIT_PORT</tspan>
        <tspan x="236" y="682">7880/tcp</tspan>
      </text>
    </g>
    <g id="livekit-tcp-port">
      <rect x="220" y="730" width="288" height="86" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="236" y="764" font-size="18" fill="#f2f4fb">
        <tspan x="236" y="764">LIVEKIT_TCP_PORT</tspan>
        <tspan x="236" y="792">7881/tcp</tspan>
      </text>
    </g>
    <g id="livekit-udp-port">
      <rect x="220" y="840" width="288" height="86" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="236" y="874" font-size="18" fill="#f2f4fb">
        <tspan x="236" y="874">LIVEKIT_UDP_PORT</tspan>
        <tspan x="236" y="902">7882/udp</tspan>
      </text>
    </g>
    <g id="mediamtx-webrtc-port">
      <rect x="220" y="1080" width="288" height="86" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="236" y="1114" font-size="18" fill="#f2f4fb">
        <tspan x="236" y="1114">MEDIAMTX_WEBRTC_PORT</tspan>
        <tspan x="236" y="1142">8189 udp+tcp</tspan>
      </text>
    </g>

    <g id="livekit-api-label">
      <text x="612" y="634" font-size="18" fill="#b3b8ff">API http://livekit:7880</text>
    </g>
    <g id="mediamtx-api-label">
      <text x="760" y="972" font-size="18" fill="#b3b8ff">WHIP, RTSP, API</text>
    </g>
    <g id="sql-label">
      <text x="910" y="1310" font-size="18" fill="#b3b8ff">SQL</text>
    </g>
    <g id="rtmp-label">
      <text x="1000" y="278" font-size="18" fill="#b3b8ff">
        <tspan x="1000" y="278">ffmpeg relays:</tspan>
        <tspan x="1000" y="306">RTMP / RTMPS</tspan>
      </text>
    </g>

    <g id="environment-file">
      <rect x="260" y="1620" width="344" height="120" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="280" y="1658" font-size="22" fill="#f2f4fb">.env:</text>
      <text x="280" y="1690" font-size="18" fill="#b9c0d8">
        <tspan x="280" y="1690">secret key, credentials</tspan>
        <tspan x="280" y="1714">(make init)</tspan>
      </text>
    </g>
    <g id="configuration-file">
      <rect x="628" y="1620" width="332" height="120" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="648" y="1658" font-size="22" fill="#f2f4fb">config.toml</text>
      <text x="648" y="1690" font-size="18" fill="#b9c0d8">(mounted read-only)</text>
    </g>

    <text x="32" y="1796" font-size="18" fill="#b9c0d8">NODE_IP is the address LiveKit and MediaMTX advertise to browsers (127.0.0.1 by default).</text>
  </g>
</svg>
