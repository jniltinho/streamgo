<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" version="1.1">
  <title>Behind a reverse proxy (nginx or Caddy)</title>
  <desc>Browsers reach the StreamGo app and API over HTTPS and LiveKit signalling over WebSocket through nginx or Caddy, with TLS on port 443 and one upstream to StreamGo on 127.0.0.1:8080. StreamGo proxies /livekit/ to livekit.api_url, with LiveKit signalling on 127.0.0.1:7880. Browser WebRTC media bypasses the proxy: ports 7881/tcp and 7882/udp reach LiveKit, and port 8189 udp+tcp reaches MediaMTX for the owner. The proxy must not log invite-token paths or the Referer header. StreamGo trusts forwarded headers only from server.trusted_proxies.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3b8ff"/>
    </marker>
  </defs>

  <rect id="canvas" x="0" y="0" width="1200" height="1000" rx="8" fill="#0c1020"/>
  <rect id="host-panel" x="756" y="90" width="412" height="744" rx="8" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>
  <rect id="browsers-box" x="40" y="170" width="180" height="120" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
  <rect id="proxy-box" x="300" y="170" width="384" height="152" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
  <rect id="streamgo-box" x="780" y="170" width="364" height="148" rx="8" fill="#3d41cf" stroke="#2c3458" stroke-width="1.5"/>
  <rect id="livekit-box" x="780" y="480" width="364" height="112" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
  <rect id="mediamtx-box" x="780" y="730" width="364" height="80" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
  <rect id="invite-note-box" x="300" y="400" width="384" height="144" rx="8" fill="#151b31" stroke="#fbbf24" stroke-width="1.5"/>

  <g fill="none" stroke="#b3b8ff" stroke-width="2" marker-end="url(#arrowhead)">
    <path id="browser-proxy-arrow" d="M 220 194 H 300"/>
    <path id="proxy-streamgo-arrow" d="M 684 194 H 780"/>
    <path id="streamgo-livekit-arrow" d="M 1118 318 V 480"/>
    <path id="browser-livekit-arrow" d="M 106 290 V 642 H 726 V 536 H 780"/>
    <path id="browser-mediamtx-arrow" d="M 70 290 V 890 H 726 V 770 H 780"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text id="diagram-title" x="40" y="54" font-size="26" fill="#f2f4fb">Behind a reverse proxy (nginx or Caddy)</text>

    <text id="browser-proxy-label" font-size="18" fill="#b3b8ff">
      <tspan x="40" y="120">https://studio.example.com: app, API</tspan>
      <tspan x="40" y="148">wss://studio.example.com/livekit/: WebSocket</tspan>
    </text>
    <text id="proxy-streamgo-label" font-size="18" text-anchor="end" fill="#b3b8ff">
      <tspan x="746" y="92">one upstream:</tspan>
      <tspan x="746" y="120">http://127.0.0.1:8080,</tspan>
      <tspan x="746" y="148">WebSocket upgrades passed</tspan>
    </text>

    <text id="host-title" x="780" y="134" font-size="22" fill="#f2f4fb">StreamGo host</text>
    <text id="browsers-title" x="80" y="241" font-size="22" fill="#f2f4fb">Browsers</text>
    <text id="proxy-title" x="324" y="214" font-size="22" fill="#f2f4fb">Reverse proxy:</text>
    <text id="proxy-software" x="324" y="252" font-size="20" fill="#f2f4fb">nginx or Caddy</text>
    <text id="proxy-tls" x="324" y="288" font-size="18" fill="#b9c0d8">TLS on 443</text>

    <text id="streamgo-title" x="804" y="213" font-size="22" fill="#f2f4fb">StreamGo</text>
    <text id="streamgo-detail" font-size="18" fill="#f2f4fb">
      <tspan x="804" y="256">app on 127.0.0.1:8080;</tspan>
      <tspan x="804" y="284">proxies /livekit/ to LiveKit</tspan>
    </text>
    <text id="streamgo-livekit-label" x="790" y="404" font-size="18" fill="#b3b8ff">/livekit/ to livekit.api_url</text>
    <text id="livekit-title" x="804" y="523" font-size="22" fill="#f2f4fb">LiveKit</text>
    <text id="livekit-detail" x="804" y="564" font-size="18" fill="#b9c0d8">(signalling on 127.0.0.1:7880)</text>
    <text id="mediamtx-title" x="804" y="779" font-size="22" fill="#f2f4fb">MediaMTX</text>

    <text id="invite-note" font-size="18" fill="#f2f4fb">
      <tspan x="324" y="440">Do not log the paths of /join/</tspan>
      <tspan x="324" y="468">and /api/v1/join/, nor the Referer</tspan>
      <tspan x="324" y="496">header: the invite token is</tspan>
      <tspan x="324" y="524">in them.</tspan>
    </text>
    <text id="browser-livekit-label" font-size="18" fill="#b3b8ff">
      <tspan x="142" y="593">WebRTC media 7881/tcp, 7882/udp:</tspan>
      <tspan x="142" y="621">not through the proxy</tspan>
    </text>
    <text id="browser-mediamtx-label" font-size="18" fill="#b3b8ff">
      <tspan x="142" y="839">WebRTC media 8189 udp+tcp (owner):</tspan>
      <tspan x="142" y="867">not through the proxy</tspan>
    </text>

    <text id="footer" x="40" y="960" font-size="18" fill="#b9c0d8">StreamGo trusts X-Forwarded-For and X-Forwarded-Proto only from server.trusted_proxies.</text>
  </g>
</svg>
