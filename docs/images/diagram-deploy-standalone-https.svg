<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" version="1.1">
  <title>Standalone HTTPS: one port, no proxy</title>
  <desc>Browsers use one StreamGo HTTPS port for the app, API and proxied LiveKit signalling. StreamGo forwards WHIP with internal credentials. Browser WebRTC media connects directly to LiveKit and MediaMTX on the StreamGo host. Certificates come from configured files or are self-signed under the data directory.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3b8ff"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#f2f4fb">
    <rect x="0" y="0" width="1200" height="1080" rx="8" fill="#0c1020"/>
    <text x="40" y="56" font-size="26" font-weight="600">Standalone HTTPS: one port, no proxy</text>

    <g id="host">
      <rect x="550" y="100" width="610" height="870" rx="8" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>
      <text x="582" y="142" font-size="22" font-weight="600">StreamGo host</text>
    </g>

    <g fill="none" stroke="#b3b8ff" stroke-width="2" marker-end="url(#arrow)">
      <path id="https" d="M 300 300 H 590"/>
      <path id="livekit-proxy" d="M 630 420 V 540"/>
      <path id="whip-forward" d="M 1096 420 V 800"/>
      <path id="livekit-media" d="M 300 345 H 350 V 605 H 590"/>
      <path id="program-media" d="M 110 375 V 865 H 590"/>
    </g>

    <g id="https-label">
      <text x="320" y="222" font-size="18" fill="#b3b8ff">
        <tspan x="320" y="222">https:// app and API +</tspan>
        <tspan x="320" y="248">wss://&lt;host&gt;/livekit,</tspan>
        <tspan x="320" y="274">on the same port</tspan>
      </text>
    </g>
    <g id="livekit-proxy-label">
      <text x="654" y="470" font-size="18" fill="#b3b8ff">
        <tspan x="654" y="470">/livekit/ proxied to livekit.api_url</tspan>
        <tspan x="654" y="498">(WebSocket upgrades)</tspan>
      </text>
    </g>
    <g id="whip-forward-label">
      <text x="1072" y="718" font-size="18" fill="#b3b8ff" text-anchor="end">
        <tspan x="1072" y="718">WHIP forwarded with</tspan>
        <tspan x="1072" y="746">internal credentials</tspan>
      </text>
    </g>
    <g id="livekit-media-label">
      <rect x="366" y="489" width="180" height="110" fill="#0c1020"/>
      <text x="382" y="523" font-size="18" fill="#b3b8ff">
        <tspan x="382" y="523">WebRTC media</tspan>
        <tspan x="382" y="551">7881/tcp,</tspan>
        <tspan x="382" y="579">7882/udp</tspan>
      </text>
    </g>
    <g id="program-media-label">
      <rect x="134" y="777" width="340" height="82" fill="#0c1020"/>
      <text x="150" y="811" font-size="18" fill="#b3b8ff">
        <tspan x="150" y="811">WebRTC media 8189 udp+tcp</tspan>
        <tspan x="150" y="839">(the owner's program)</tspan>
      </text>
    </g>

    <g id="browsers">
      <rect x="40" y="225" width="260" height="150" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="170" y="285" font-size="22" text-anchor="middle">
        <tspan x="170" y="285" font-weight="600">Browsers</tspan>
        <tspan x="170" y="319">(owner and guests)</tspan>
      </text>
    </g>
    <g id="streamgo">
      <rect x="590" y="180" width="530" height="240" rx="8" fill="#3d41cf" stroke="#2c3458" stroke-width="1.5"/>
      <text x="614" y="222" font-size="22" font-weight="600">StreamGo</text>
      <text x="614" y="262" font-size="18">
        <tspan x="614" y="262">HTTPS on server.addr (e.g. :443 or :8443)</tspan>
        <tspan x="614" y="292">certificate from cert_file and key_file,</tspan>
        <tspan x="614" y="322">or self-signed under &lt;data_dir&gt;/tls</tspan>
      </text>
      <g id="public-livekit-note">
        <text x="614" y="365" font-size="18">
          <tspan x="614" y="365">livekit.url empty: browsers get</tspan>
          <tspan x="614" y="393">wss://&lt;public host&gt;/livekit</tspan>
        </text>
      </g>
    </g>
    <g id="livekit">
      <rect x="590" y="540" width="430" height="130" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="614" y="585" font-size="22" font-weight="600">LiveKit</text>
      <text x="614" y="627" font-size="18" fill="#b9c0d8">(signalling on 127.0.0.1:7880 only)</text>
    </g>
    <g id="mediamtx">
      <rect x="590" y="800" width="530" height="130" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="614" y="845" font-size="22" font-weight="600">MediaMTX</text>
      <text x="614" y="887" font-size="18" fill="#b9c0d8">(WHIP, RTSP, API on 127.0.0.1 only)</text>
    </g>

    <g id="footer">
      <rect x="40" y="1000" width="1120" height="56" fill="#0c1020"/>
      <text x="56" y="1034" font-size="18" fill="#b9c0d8">Self-signed: each device accepts the warning once; guests see it too, through the invite link.</text>
    </g>
  </g>
</svg>
