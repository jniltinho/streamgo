<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1856" viewBox="0 0 1200 1856" version="1.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#f2f4fb">
  <title>The media path: from the browsers to the destinations</title>
  <desc>In the first row, guests and the owner send cameras, microphones and screens over WebRTC to LiveKit's studio room bc_&lt;id&gt;. LiveKit returns every participant's subscribed tracks to the owner's browser, where a canvas compositor and a limited program audio bus make the program. A media arrow connects the owner's browser to the second row: the program reaches MediaMTX's program/&lt;id&gt; path directly over WHIP and WebRTC, using UDP with TCP fallback. Dashed signaling arrows show StreamGo receiving the HTTPS SDP offer and forwarding it to MediaMTX with internal credentials. MediaMTX sends the program over RTSP over TCP to an ffmpeg transcoder, which publishes over RTSP to the air/&lt;id&gt; path in the same MediaMTX panel. Three copy-only ffmpeg relays send air to YouTube, Twitch and a custom RTMP server, one relay per enabled destination. StreamGo starts and watches the ffmpeg processes. The owner's browser, not a server-side compositor, composes the program; there is no Redis or Egress.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#b3b8ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1856" rx="8" fill="#0c1020"/>
  <g id="diagram-heading">
    <rect x="32" y="16" width="1136" height="72" fill="#0c1020"/>
    <text x="48" y="60" font-size="26" font-weight="600">The media path: from the browsers to the destinations</text>
  </g>

  <!-- Row 1: participant tracks and browser-side composition. -->
  <g id="guests">
    <rect x="48" y="132" width="340" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="218" y="191" text-anchor="middle" font-size="22" font-weight="600">Guests' browsers</text>
  </g>
  <g id="livekit">
    <rect x="48" y="448" width="340" height="150" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="218" y="492" text-anchor="middle" font-size="22" font-weight="600">LiveKit</text>
    <text x="218" y="530" text-anchor="middle" font-size="20" fill="#b9c0d8">
      <tspan x="218" y="530">studio room</tspan>
      <tspan x="218" y="560">bc_&lt;id&gt;</tspan>
    </text>
  </g>
  <g id="owner">
    <rect x="700" y="132" width="452" height="480" rx="8" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>
    <text x="724" y="172" font-size="22" font-weight="600">Owner's browser</text>
    <g id="compositor">
      <rect x="724" y="202" width="404" height="170" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="744" y="239" font-size="21" font-weight="600">Compositor</text>
      <text x="744" y="274" font-size="18" fill="#b9c0d8">
        <tspan x="744" y="274">canvas, layout, name tags,</tspan>
        <tspan x="744" y="300">logo, banner</tspan>
        <tspan x="744" y="326">(30 fps, Worker timer)</tspan>
      </text>
    </g>
    <g id="audio-mix">
      <rect x="724" y="396" width="404" height="112" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="744" y="432" font-size="20" font-weight="600">Audio mix</text>
      <text x="744" y="468" font-size="18" fill="#b9c0d8">program bus with limiter</text>
    </g>
    <text x="926" y="568" text-anchor="middle" font-size="22" fill="#b3b8ff">Together: the program</text>
  </g>

  <g fill="none" stroke="#b3b8ff" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 218 232 V 448"/>
    <path d="M 388 464 H 700"/>
    <path d="M 700 584 H 388"/>
  </g>
  <g id="guest-tracks-label">
    <rect x="240" y="264" width="330" height="114" fill="#0c1020"/>
    <text x="256" y="298" font-size="18" fill="#b3b8ff">
      <tspan x="256" y="298">cameras, microphones</tspan>
      <tspan x="256" y="324">and screens</tspan>
      <tspan x="256" y="350">over WebRTC</tspan>
    </text>
  </g>
  <g id="subscribed-tracks-label">
    <rect x="404" y="400" width="280" height="56" fill="#0c1020"/>
    <text x="420" y="436" font-size="18" fill="#b3b8ff">subscribed tracks</text>
  </g>
  <g id="owner-tracks-label">
    <rect x="404" y="480" width="280" height="80" fill="#0c1020"/>
    <text x="420" y="514" font-size="18" fill="#b3b8ff">
      <tspan x="420" y="514">cameras, microphones</tspan>
      <tspan x="420" y="540">and screens over WebRTC</tspan>
    </text>
  </g>

  <!-- Thin dashed arrows carry signaling; the solid arrow carries media between rows. -->
  <g id="streamgo">
    <rect x="436" y="696" width="296" height="92" rx="8" fill="#3d41cf" stroke="#2c3458" stroke-width="1.5"/>
    <text x="584" y="749" text-anchor="middle" font-size="22" font-weight="600">StreamGo</text>
  </g>
  <g fill="none" stroke="#b3b8ff" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <path d="M 700 600 H 584 V 696"/>
    <path d="M 584 788 V 832 H 198 V 940"/>
  </g>
  <g id="sdp-label">
    <rect x="340" y="620" width="220" height="56" fill="#0c1020"/>
    <text x="356" y="656" font-size="18" fill="#b3b8ff">SDP offer (HTTPS)</text>
  </g>
  <g id="forwarded-sdp-label">
    <rect x="216" y="840" width="350" height="80" fill="#0c1020"/>
    <text x="232" y="874" font-size="18" fill="#b3b8ff">
      <tspan x="232" y="874">forwarded with internal</tspan>
      <tspan x="232" y="900">credentials</tspan>
    </text>
  </g>

  <!-- Row 2: the two MediaMTX paths share one panel. -->
  <g id="mediamtx">
    <rect x="48" y="940" width="300" height="568" rx="8" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>
    <text x="72" y="986" font-size="22" font-weight="600">MediaMTX</text>
    <g id="program-path">
      <rect x="72" y="1050" width="252" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="198" y="1107" text-anchor="middle" font-size="20">program/&lt;id&gt;</text>
    </g>
    <g id="air-path">
      <rect x="72" y="1384" width="252" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="198" y="1441" text-anchor="middle" font-size="20">air/&lt;id&gt;</text>
    </g>
  </g>
  <path d="M 1104 612 V 1022 H 198 V 1050" fill="none" stroke="#b3b8ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g id="whip-label">
    <rect x="728" y="862" width="352" height="92" fill="#0c1020"/>
    <text x="744" y="896" font-size="18" fill="#b3b8ff">
      <tspan x="744" y="896">WHIP: media direct over WebRTC</tspan>
      <tspan x="744" y="922">(UDP, TCP fallback)</tspan>
    </text>
  </g>

  <g id="transcoder">
    <rect x="500" y="1050" width="360" height="188" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="520" y="1090" font-size="22" font-weight="600">ffmpeg transcoder</text>
    <text x="520" y="1126" font-size="18" fill="#b9c0d8">
      <tspan x="520" y="1126">libx264 veryfast, 30 fps,</tspan>
      <tspan x="520" y="1152">keyframe every 2 s;</tspan>
      <tspan x="520" y="1178">AAC 48 kHz stereo</tspan>
    </text>
  </g>
  <g fill="none" stroke="#b3b8ff" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 324 1100 H 500"/>
    <path d="M 680 1238 V 1280 H 198 V 1384"/>
  </g>
  <g id="rtsp-tcp-label">
    <text x="360" y="1072" font-size="18" fill="#b3b8ff">RTSP over TCP</text>
  </g>
  <g id="rtsp-label">
    <rect x="696" y="1240" width="112" height="56" fill="#0c1020"/>
    <text x="712" y="1276" font-size="18" fill="#b3b8ff">RTSP</text>
  </g>
  <g id="ffmpeg-supervision-note">
    <rect x="888" y="1070" width="264" height="80" fill="#0c1020"/>
    <text x="904" y="1104" font-size="18" fill="#b9c0d8">
      <tspan x="904" y="1104">started and watched</tspan>
      <tspan x="904" y="1130">by StreamGo</tspan>
    </text>
  </g>

  <g id="relay-group-label">
    <rect x="484" y="1306" width="668" height="56" fill="#0c1020"/>
    <text x="500" y="1342" font-size="18" fill="#b3b8ff">one relay per enabled destination</text>
  </g>
  <g id="youtube-relay">
    <rect x="500" y="1384" width="320" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="660" y="1441" text-anchor="middle" font-size="20">ffmpeg relay (-c copy)</text>
  </g>
  <g id="twitch-relay">
    <rect x="500" y="1516" width="320" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="660" y="1573" text-anchor="middle" font-size="20">ffmpeg relay (-c copy)</text>
  </g>
  <g id="custom-relay">
    <rect x="500" y="1648" width="320" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="660" y="1705" text-anchor="middle" font-size="20">ffmpeg relay (-c copy)</text>
  </g>
  <g id="youtube">
    <rect x="880" y="1384" width="272" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="1016" y="1441" text-anchor="middle" font-size="20">YouTube (rtmps://)</text>
  </g>
  <g id="twitch">
    <rect x="880" y="1516" width="272" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="1016" y="1573" text-anchor="middle" font-size="20">Twitch (rtmp://)</text>
  </g>
  <g id="custom-destination">
    <rect x="880" y="1648" width="272" height="100" rx="8" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
    <text x="1016" y="1705" text-anchor="middle" font-size="20">Your own RTMP server</text>
  </g>
  <g fill="none" stroke="#b3b8ff" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 324 1434 H 500"/>
    <path d="M 324 1434 H 452 V 1566 H 500"/>
    <path d="M 324 1434 H 452 V 1698 H 500"/>
    <path d="M 820 1434 H 880"/>
    <path d="M 820 1566 H 880"/>
    <path d="M 820 1698 H 880"/>
  </g>

  <g id="footer-note">
    <rect x="32" y="1780" width="1136" height="56" fill="#0c1020"/>
    <text x="48" y="1816" font-size="18" fill="#b9c0d8">No Redis, no Egress, no server-side composition: the owner's browser composes the program.</text>
  </g>
</svg>
