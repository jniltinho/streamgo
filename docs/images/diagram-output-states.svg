<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1048" viewBox="0 0 1200 1048" version="1.1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Output states</title>
  <desc>Broadcast output moves between offline, starting, live and interrupted. Starting times out without a program; interrupted returns to live if the program resumes before the reconnect deadline, or goes offline after the deadline. The owner can end from starting, live or interrupted using the shared bottom return line. A second panel shows the owner-only destination states and relay retry intervals. The stage on_air flag is true exactly while the broadcast is live.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b3b8ff"/>
    </marker>
  </defs>

  <rect width="1200" height="1048" rx="8" fill="#0c1020"/>
  <text x="56" y="54" font-size="26" fill="#f2f4fb">Output states</text>

  <g id="state-machine">
    <rect x="32" y="88" width="1136" height="664" rx="16" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>

    <g fill="none" stroke="#b3b8ff" stroke-width="2" stroke-linejoin="round">
      <path id="deadline-passed" d="M1094 416 V144 H84 V416" marker-end="url(#arrow)"/>
      <path id="start-timeout" d="M454 416 V224 H134 V416" marker-end="url(#arrow)"/>
      <path id="go-live" d="M264 456 H354" marker-end="url(#arrow)"/>
      <path id="transcoder-flowing" d="M554 456 H644" marker-end="url(#arrow)"/>
      <path id="program-lost" d="M844 456 H934" marker-end="url(#arrow)"/>
      <path id="program-resumed" d="M994 496 V552 H804 V496" marker-end="url(#arrow)"/>
      <path id="end-from-starting" d="M454 496 V720"/>
      <path id="end-from-live" d="M744 496 V720"/>
      <path id="end-return" d="M1034 496 V720 H164 V496" marker-end="url(#arrow)"/>
    </g>

    <text x="744" y="128" text-anchor="middle" font-size="18" fill="#b3b8ff">deadline passed: reason "program lost"</text>
    <text x="294" y="184" text-anchor="middle" font-size="18" fill="#b3b8ff">
      <tspan x="294" dy="0">no program within start_timeout:</tspan>
      <tspan x="294" dy="24">reason "no program received"</tspan>
    </text>
    <text x="309" y="346" text-anchor="middle" font-size="18" fill="#b3b8ff">
      <tspan x="309" dy="0">go live</tspan>
      <tspan x="309" dy="24">(a destination chosen,</tspan>
      <tspan x="309" dy="24">capacity free)</tspan>
    </text>
    <text x="599" y="394" text-anchor="middle" font-size="18" fill="#b3b8ff">transcoder flowing</text>
    <text x="889" y="346" text-anchor="middle" font-size="18" fill="#b3b8ff">
      <tspan x="889" dy="0">program lost: relays stop,</tspan>
      <tspan x="889" dy="24">deadline = now +</tspan>
      <tspan x="889" dy="24">reconnect_grace</tspan>
    </text>
    <text x="899" y="582" text-anchor="middle" font-size="18" fill="#b3b8ff">
      <tspan x="899" dy="0">program flowing again</tspan>
      <tspan x="899" dy="24">before the deadline</tspan>
    </text>
    <text x="599" y="704" text-anchor="middle" font-size="18" fill="#b3b8ff">end (the owner)</text>

    <g id="offline">
      <rect x="64" y="416" width="200" height="80" rx="16" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="164" y="464" text-anchor="middle" font-size="22" fill="#f2f4fb">offline</text>
    </g>
    <g id="starting">
      <rect x="354" y="416" width="200" height="80" rx="16" fill="#1d2442" stroke="#b3b8ff" stroke-width="1.5"/>
      <text x="454" y="464" text-anchor="middle" font-size="22" fill="#f2f4fb">starting</text>
    </g>
    <g id="live">
      <rect x="644" y="416" width="200" height="80" rx="16" fill="#1d2442" stroke="#4ade80" stroke-width="1.5"/>
      <text x="744" y="464" text-anchor="middle" font-size="22" fill="#4ade80">live</text>
    </g>
    <g id="interrupted">
      <rect x="934" y="416" width="200" height="80" rx="16" fill="#1d2442" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="1034" y="464" text-anchor="middle" font-size="22" fill="#fbbf24">interrupted</text>
    </g>
  </g>

  <g id="destinations">
    <rect x="32" y="784" width="1136" height="184" rx="16" fill="#151b31" stroke="#2c3458" stroke-width="1.5"/>
    <text x="56" y="824" font-size="22" fill="#f2f4fb">Each destination (shown to the owner only)</text>
    <g id="destination-off">
      <rect x="56" y="848" width="240" height="64" rx="12" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="176" y="888" text-anchor="middle" font-size="20" fill="#f2f4fb">off</text>
    </g>
    <g id="destination-connecting">
      <rect x="320" y="848" width="240" height="64" rx="12" fill="#1d2442" stroke="#2c3458" stroke-width="1.5"/>
      <text x="440" y="888" text-anchor="middle" font-size="20" fill="#f2f4fb">connecting</text>
    </g>
    <g id="destination-live">
      <rect x="584" y="848" width="240" height="64" rx="12" fill="#1d2442" stroke="#4ade80" stroke-width="1.5"/>
      <text x="704" y="888" text-anchor="middle" font-size="20" fill="#4ade80">live</text>
    </g>
    <g id="destination-retrying">
      <rect x="848" y="848" width="296" height="64" rx="12" fill="#1d2442" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="996" y="888" text-anchor="middle" font-size="20" fill="#fbbf24">retrying + last error</text>
    </g>
    <text x="56" y="944" font-size="18" fill="#b9c0d8">a relay that stalls or exits is retried after 1, 2, 5, then every 10 s</text>
  </g>

  <text x="56" y="1012" font-size="18" fill="#b9c0d8">on_air in the stage state is true exactly while the broadcast is live.</text>
</svg>
